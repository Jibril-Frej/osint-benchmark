[project]
name = "osint-benchmark"
version = "0.1.0"
description = "Construction of a benchmark whose questions each need one confidential and one public document"
requires-python = ">=3.13"

dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

# Installed editable by `uv sync` so the numbered files in `pipeline/` can import the
# package from anywhere without a sys.path insert. Not published anywhere.
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osint_benchmark"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
