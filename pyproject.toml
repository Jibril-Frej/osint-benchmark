[project]
name = "osint-benchmark"
version = "0.1.0"
description = "Construction of a benchmark whose questions each need one confidential and one public document"
requires-python = ">=3.13"

dependencies = []

# Entity linking is optional because it pulls torch and transformers -- gigabytes, against
# the seven small packages the rest of the project needs. Only step 2 with a real linker
# uses them, so `uv sync` stays fast for everyone else, including the smoke path.
#
# ReFinED is not on PyPI under that name: `refined` there is an unrelated type-hints
# package. It installs from source. The previous project pinned transformers 4.46 and
# needed two patches to the ReFinED source on top, and ran it in a dedicated environment
# rather than the project venv -- so treat this group as a starting point, not a
# guarantee, and expect to need a separate environment on a machine with CUDA.
[project.optional-dependencies]
link = [
    "refined @ git+https://github.com/amazon-science/ReFinED.git",
    # Pinned: ReFinED reads a tokenizer API that later releases removed.
    "transformers==4.46.*",
    "torch",
    # Cablegate is transmitted in upper case, and a linker trained on cased English gets
    # almost nothing from it. This one dependency is worth more than every threshold in
    # osint_benchmark/link/refined.py.
    "truecase",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

# Installed editable by `uv sync` so the numbered files in `pipeline/` can import the
# package from anywhere without a sys.path insert. Not published anywhere.
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ReFinED is not on PyPI, so the link extra references its git repository directly.
# Hatchling refuses a direct reference unless told to allow one.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["osint_benchmark"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
