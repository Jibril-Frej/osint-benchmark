# Where every raw input comes from, and what it must hash to.
#
# This file is the reason the repo ships build scripts instead of corpora: a rebuilder
# can confirm their copy of a source is byte-identical to the one the benchmark was
# built against without receiving any of it. Re-pinning a dump date is an edit here,
# never a code change.
#
# An origin with no `url` is one that is not redistributed and cannot be fetched
# unattended; its `note` says how to obtain it, and `fetch` reports that note instead
# of failing obscurely.

[cablegate]
kind = "private"

[[cablegate.origins]]
filename = "cables.csv"
url = ""
sha256 = "ad9b7530f038e4237f1729843d1dc096a63162a4ff8024e596ec3b2a8e64b139"
size = 1730507223
note = """WikiLeaks Cablegate, the full cable set as one CSV. Not redistributed by this
project. Obtain cables.csv from a public Cablegate mirror and place it at
<OSINT_RAW>/cablegate/cables.csv, or point OSINT_RAW at a directory that already holds
it. The pinned size and checksum identify the exact copy the benchmark was built from."""
