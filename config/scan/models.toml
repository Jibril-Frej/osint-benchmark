# The page-scan questions: QwQ-32B for text, Qwen2.5-VL-7B for the scan. Both served at once.
#
# office_holder and addressee have computed answers, so no judge scores them; the [judge]
# here is only step 7's check that an ablation answer says the same thing as the gold one,
# where one model in both roles is no bias. The phraser is QwQ as in config/qwq.
#
# Step 7 with --vision needs the text solver and the vision solver at the same time: every
# condition but private-only is text, and private-only of a page-scan question is the image.
# cluster/scan.sbatch serves QwQ on all but one GPU and the vision model on the last.

[phraser]
model = "Qwen/QwQ-32B"
endpoint = ""
temperature = 0.7
# QwQ is a reasoning model: replies open with a <think> block that must be stripped before
# the answer is read. 4096 was not a ceiling, it was a wall -- on job 13349 it truncated 79
# of 80 replies inside the reasoning trace, before any JSON was emitted, and the pipeline
# recorded one question out of eighty with no indication why. QwQ is designed to think for
# thousands of tokens; the budget has to allow for it and then leave room for the answer.
max_tokens = 16384
samples = 1

[judge]
model = "Qwen/QwQ-32B"
endpoint = ""
temperature = 0.7
# Less than the phraser: the judge decides one thing and answers in one word, so its
# reasoning is shorter. Still far above 4096, because a truncated verdict is not a
# rejection -- it is a reply with no verdict in it, which fails the agreement check and
# discards a question that may have been fine.
max_tokens = 8192
# Three samples, unanimous only. Unanimity is meaningless at temperature 0, so the repeats
# have to differ for the agreement to mean anything.
samples = 3

[solver]
model = "Qwen/QwQ-32B"
endpoint = ""
temperature = 0.7
# A truncated solver reply reads as a failure to answer, and a solver that cannot answer
# makes every question look necessary. This is the number that silently inflated the
# previous project's necessity rate.
max_tokens = 16384
samples = 1

[vision_solver]
# The family the hybrid system's image strategies were run with, as in config/models.toml.
model = "Qwen/Qwen2.5-VL-7B-Instruct"
endpoint = ""
temperature = 0.7
max_tokens = 1024
samples = 1
