# Linking parameters for the smoke profile.
#
# Identical to the real ones except for the batch size: the smoke run links a couple of
# thousand documents, and a smaller batch reaches the first output sooner, which is what a
# smoke run is for.

[refined]
model = "wikipedia_model_with_numbers"
entity_set = "wikipedia"
confidence = 0.5
batch_size = 16
max_chars = 4000

[dictionary]
min_title_words = 2
min_title_chars = 6

[reconcile]
aliases = true
# How candidates are found. "exact" asks whether the name appears verbatim as a label or
# alias; "search" asks Wikidata's own ranked search and then verifies each candidate on
# name, entity kind and birth year. The previous project resolved 1,232 of the sanctions
# list's 8,604 targets by searching, against 383 here by exact match -- and the public leg
# is the ceiling on how many bridges can exist.
method = "search"
